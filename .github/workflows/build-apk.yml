name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Install Android SDK Platform 36 & Build Tools
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Create .env from template if missing
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env
          fi

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Android APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Prepare APK Release Directory
        run: |
          mkdir -p release-apks
          DEBUG_APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)

          if [ -n "$DEBUG_APK" ] && [ -f "$DEBUG_APK" ]; then
            cp "$DEBUG_APK" release-apks/RoomieVault-v1.3.apk
            cp "$DEBUG_APK" release-apks/RoomieVault-v1.2.apk
            cp "$DEBUG_APK" release-apks/RoomieVault-v1.1.apk
            cp "$DEBUG_APK" release-apks/app-release.apk
            cp "$DEBUG_APK" release-apks/app-debug.apk
          fi

          ls -la release-apks/

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RoomieVault-v1.3-APK
          path: release-apks/*.apk
          retention-days: 30

      - name: Publish GitHub Release v1.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v1.3 --yes 2>/dev/null || true
          git tag -d v1.3 2>/dev/null || true
          git push origin :refs/tags/v1.3 2>/dev/null || true

          gh release create v1.3 release-apks/*.apk \
            --title "RoomieVault v1.3 Release" \
            --notes "### 🚀 RoomieVault v1.3 Release
          - **Supabase Cloud Backend**: Connected to https://gxpxbnrehrawxwgzdqqm.supabase.co
          - **Clean Authentication**: Focused Sign In & Sign Up flow with clean error messaging
          - **Full Feature Suite**: Fair Splits, Sunday Chores, 1-Tap UPI payments, and receipt management"
