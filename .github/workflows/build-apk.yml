name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Install Android SDK Platform 36 & Build Tools
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Create .env from template if missing
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env
          fi

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Android APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee build.log

      - name: Push Debug Log on Failure
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B debug-log
          git add -f build.log
          git commit -m "ci: debug build failure log"
          git push origin debug-log --force

      - name: Prepare APK Release Directory
        run: |
          mkdir -p release-apks
          DEBUG_APK=$(find app/build -name "*.apk" | head -n 1)

          VERSION=$(grep -o '"versionName": *"[^"]*"' version.json | cut -d'"' -f4)
          if [ -z "$VERSION" ]; then
            VERSION="1.5"
          fi
          TAG="v$VERSION"
          echo "Building release for version $VERSION ($TAG)"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "TAG=$TAG" >> $GITHUB_ENV

          if [ -n "$DEBUG_APK" ] && [ -f "$DEBUG_APK" ]; then
            cp "$DEBUG_APK" "release-apks/RoomieVault-${TAG}.apk"
            cp "$DEBUG_APK" release-apks/RoomieVault-latest.apk
            cp "$DEBUG_APK" release-apks/app-release.apk
            cp "$DEBUG_APK" release-apks/app-debug.apk
          fi

          ls -la release-apks/

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RoomieVault-${{ env.TAG }}-APK
          path: release-apks/*.apk
          retention-days: 30

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$TAG" \
            --title "RoomieVault $TAG Release" \
            --notes "### 🚀 RoomieVault $TAG Release
          - **Roommate Invite with GitHub Download Link**: Invite code sharing includes GitHub APK download link
          - **External Friends for Giving & Receiving Money**: Separate tracking for external friends with [Friend] badges
          - **Gmail Account Search**: Real-time Supabase account search by Gmail ID
          - **Automatic Debt Reconciliation**: Unregistered friends link automatically when they sign up later
          - **Email Confirmed Popup**: Displays verified status and guides user back to login" 2>/dev/null || true

          gh release upload "$TAG" release-apks/*.apk --clobber || true
